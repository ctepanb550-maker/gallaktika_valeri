 ['lyubov','Любовь','#ff7a9c'],['zabota','Забота','#ffb38a'],['nezhnost','Нежность','#f9b8d4'],

// Орбиты: у каждого слова своё эллиптическое кольцо; слова мягко расходятся, чтобы не налезать друг на друга
function place(w){w.x=Math.cos(w.a)*w.rx;w.y=Math.sin(w.a)*w.ry}
function layout(){
 const W=innerWidth,H=innerHeight,Rx=Math.max(70,W/2-59),Ry=Math.max(70,H/2-80);
 WORDS.forEach(w=>{
  w.bw=w.el.offsetWidth||80;w.bh=w.el.offsetHeight||28;
  w.rx=Math.min(62+(Rx-62)*w.t,W/2-6-w.bw/2);w.ry=62+(Ry-62)*w.t;
  w.rg.setAttribute('cx',W/2);w.rg.setAttribute('cy',H/2);w.rg.setAttribute('rx',w.rx);w.rg.setAttribute('ry',w.ry);
  place(w);w.vx=w.x;w.vy=w.y;
 });
}
function nudge(w,t,d){if(Math.abs(t)<2)return;w.a+=Math.max(-.012,Math.min(.012,d/t));place(w)}
function relax(){
 for(let it=0;it<4;it++)for(let i=0;i<15;i++)for(let j=i+1;j<15;j++){

// earn: key — уникальный id награды, повторно она не начисляется (даже после обновления страницы)
function earn(key,n,why){
 const E=D.econ;if(!(n>0)||(key&&E.claimed.includes(key)))return false;
 E.cookies+=n;E.earned+=n;if(key){E.claimed.push(key);if(E.claimed.length>400)E.claimed.shift()}
 E.log.push({t:Date.now(),d:n,w:why});if(E.log.length>200)E.log.shift();save();return true;
}
function spend(n,why){
 const E=D.econ;if(!(n>0)||E.cookies<n)return false;
 E.cookies-=n;E.spent+=n;E.log.push({t:Date.now(),d:-n,w:why});if(E.log.length>200)E.log.shift();save();return true;
}

// Всё хранится в общем D (localStorage): баланс — D.econ, вещи — D.items, экипировка — D.pet.equip,
// карточки — D.words[id].found, покупки — D.shop. Цены берутся ТОЛЬКО из каталога (SHOP_SETS / CARD_PRICE).
// Логика покупок (buySet / buyCards) отделена от интерфейса: при переезде на общую базу её можно
// перенести на сервер без переписывания экрана.
let stab=0,sMsg=null,shopBusy=false;
const SGREET=['Добро пожаловать в Лавку! Всё свежее, всё с печеньками.','О, покупатель! Проходи, не стесняйся. ГА!','Лавка открыта! Смотри, выбирай, только лапами не трогай.'];
const STAPQ=['Эй, я тут продавец, а не экспонат!','ГА! Печеньки считаются на кассе.','Чего тыкаешь? Купи что-нибудь, а?'];
const POORQ='Кря! Кажется, у тебя пока маловато печенек. Но ничего, мы ещё накопим!';
const CARDQ=['Ого! Ещё целая стопка пожеланий! Давай посмотрим, что там интересного.','Свежая партия пожеланий! Ещё тёплые. ГА!','Пожелания подвезли! Читай, пока я их не съел.'];
const FULLQ='Коллекция полностью заполнена! Дальше только перечитывать.';
const setById=id=>SHOP_SETS.find(x=>x.id===id);
const itemById=id=>ITEMS.find(x=>x.id===id);
const isWorn=st=>st.ids.every(id=>D.pet.equip[itemById(id).slot]===id);
function cardsHave(){return WORDS.filter(w=>D.words[w.id].found.length>0).length}
function missingCards(){return WORDS.filter(w=>w.wishes&&D.words[w.id].found.length===0)}
function shopHist(n,c){D.shop.hist.push({t:Date.now(),n,c});if(D.shop.hist.length>100)D.shop.hist.shift()}

// ---- покупка комплекта: проверка баланса → проверка дубля → списание → вещи в гардероб → журнал ----
function buySet(id){
 const st=setById(id);if(!st)return {ok:false,why:'unknown'};
 if(D.shop.sets.includes(id))return {ok:false,why:'owned'};
 if(shopBusy)return {ok:false,why:'busy'};
 if(D.econ.cookies<st.price)return {ok:false,why:'poor'};
 shopBusy=true;
 try{
  if(!spend(st.price,'Лавка: комплект «'+st.name+'»'))return {ok:false,why:'poor'};
  st.ids.forEach(i=>{if(!D.items.includes(i))D.items.push(i)});
  D.shop.sets.push(id);D.shop.buys++;
  shopHist('Комплект «'+st.name+'»',st.price);logEv('shop','Куплен комплект «'+st.name+'»');save();
  return {ok:true};
 }finally{setTimeout(()=>{shopBusy=false},500)}
}
// ---- покупка карточек: только недостающие, без дублей, цена считается по их числу ----
function buyCards(){
 const need=missingCards();if(!need.length)return {ok:false,why:'full'};
 if(shopBusy)return {ok:false,why:'busy'};
 const cost=need.length*CARD_PRICE;if(D.econ.cookies<cost)return {ok:false,why:'poor',cost};
 shopBusy=true;
 try{
  if(!spend(cost,'Лавка: карточки пожеланий ('+need.length+')'))return {ok:false,why:'poor'};
  const got=need.map(w=>{const s=D.words[w.id],idx=pick(w.wishes.map((_,i)=>i).filter(i=>!s.found.includes(i)));s.found.push(idx);if(!s.seen.includes(idx))s.seen.push(idx);return w});
  D.shop.buys++;shopHist('Карточки пожеланий ×'+got.length,cost);logEv('shop','Куплено карточек пожеланий: '+got.length);save();refreshMarks();
  return {ok:true,got,cost};
 }finally{setTimeout(()=>{shopBusy=false},500)}
}
// ---- «Надеть комплект»: вещи уже в гардеробе, надевание — только по кнопке ----
function equipSet(id){
 const st=setById(id);if(!st||!D.shop.sets.includes(id))return false;
 st.ids.forEach(i=>{D.pet.equip[itemById(i).slot]=i});
 if(!st.parts.glasses)delete D.pet.equip.glasses;
 logEv('equip','Валера надел комплект «'+st.name+'»');save();snd('key');refreshGeese();checkAch();return true;
}

function burst(chars,n){

 for(let i=0;i<n;i++)puff(c,innerWidth/2,innerHeight*.4,pick(chars),'',{dist:Math.min(innerWidth,360)*.7,dur:1500,size:rnd(18,30)});
 setTimeout(()=>c.remove(),2200);
}
const RFX={common:['🌾','🍪','✨'],rare:['😎','✨','🎶'],legend:['⭐','✨','🚀','💫'],epic:['👽','💫','🛸','✨']};

function setCard(st){

 const c=el('div','sk '+st.rar+(own?' own':''));c.style.setProperty('--r',rc);

 const si=el('div','si'),rt=el('span','rt',RAR[st.rar][0]),ul=el('ul'),fr=el('div','sf');
 rt.style.setProperty('--r',rc);
 PART_ORDER.forEach(sl=>{if(st.parts[sl])ul.appendChild(el('li','',PART_LBL[sl]+': '+st.parts[sl]))});
 fr.append(el('b','','🍪 '+st.price),el('span','',own?'✅ Куплен':poor?'Недостаточно печенек':'Доступен'));
 si.append(el('b','',st.tag+' '+st.name),el('br'),rt,ul,fr);

// Свои мелодии: положи mp3 в папку music/ репозитория и добавь строку, например:
// {id:'my1',name:'Моя мелодия',src:'music/my1.mp3'}. Используй только свои или свободные от прав записи.
const MUSIC_FILES=[];
const NOTE={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const midi=n=>{const m=/^([A-G])(#|b)?(\d)$/.exec(n);return 12*(+m[3]+1)+NOTE[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0)};
const hz=m=>440*Math.pow(2,(m-69)/12);
const melody=str=>{let t=0;return str.trim().split(/\s+/).map(x=>{const [n,b]=x.split(':'),o={t,d:+b,n:n==='r'?null:midi(n)};t+=+b;return o})};
const chords=str=>{let t=0;const o=[];str.trim().split(/\s+/).forEach(x=>{const [ns,b]=x.split(':');ns.split(',').forEach(n=>o.push({t,d:+b,n:midi(n)}));t+=+b});return o};
// Четыре оригинальные спокойные мелодии (синтез в браузере, без файлов). Каждая длится 16 долей и играет по кругу.
const TRACKS={
 organ:{name:'🎹 Орган · Тихий вечер',inst:'organ',bpm:58,mv:.16,cv:.07,m:melody('E4:2 G4:1 A4:1 G4:2 E4:2 D4:2 E4:1 F4:1 E4:2 C4:2'),c:chords('C3,E3,G3:4 A2,E3,A3:4 F2,C3,A3:4 G2,D3,B3:4')},
 flute:{name:'🪈 Флейта · Утренний ручей',inst:'flute',bpm:66,mv:.2,cv:.06,m:melody('D5:1.5 F#5:.5 A5:1 F#5:1 E5:2 B4:1.5 D5:.5 E5:1 F#5:1 D5:2 r:1 A4:3'),c:chords('D3,A3:4 B2,F#3:4 G2,D3:4 A2,E3:4')},
 violin:{name:'🎻 Скрипка · Лунная колыбельная',inst:'violin',bpm:56,mv:.15,cv:.06,m:melody('A4:2 C5:1 E5:1 D5:2 C5:2 B4:2 G4:1 A4:1 E4:4'),c:chords('A2,E3,A3:4 F2,C3,A3:4 C3,G3,E4:4 E2,B2,G#3:4')},
 cello:{name:'🎼 Виолончель · Дождь за окном',inst:'cello',bpm:54,mv:.22,cv:.05,m:melody('A3:3 C4:1 E4:2 D4:2 C4:3 B3:1 A3:4'),c:chords('A2,E3:8 F2,C3:4 E2,B2:4')}
};
const PADS={organ:{h:[1,.5,.33,.2],w:'sine',a:.3,r:.7},flute:{h:[1,.15],w:'sine',a:.12,r:.4,vib:5.2,vd:10},violin:{h:[1],w:'sawtooth',a:.18,r:.5,lp:2200,vib:5.5,vd:14},cello:{h:[1],w:'sawtooth',a:.25,r:.7,lp:900,vib:4.5,vd:10}};
const MUS={cur:null,tg:null,nodes:[],timer:0,next:0,audio:null};
let MG=null;
const ctx=()=>{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC};
function mg(){const c=ctx();if(!MG){MG=c.createGain();MG.gain.value=D.music.vol*.5;MG.connect(c.destination)}return MG}
function voice(c,out,type,f,t,d,vol){
 const P=PADS[type],env=c.createGain(),mix=c.createGain();let last=mix;
 if(P.lp){const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=P.lp;mix.connect(fl);last=fl}
 last.connect(env);env.connect(out);
 env.gain.setValueAtTime(0,t);env.gain.linearRampToValueAtTime(vol,t+P.a);env.gain.setValueAtTime(vol,Math.max(t+P.a,t+d-.05));env.gain.linearRampToValueAtTime(0,t+d+P.r);
 P.h.forEach((a,i)=>{
  const o=c.createOscillator(),og=c.createGain();o.type=P.w;o.frequency.value=f*(i+1);og.gain.value=a;o.connect(og);og.connect(mix);
  if(P.vib){const l=c.createOscillator(),lg=c.createGain();l.frequency.value=P.vib;lg.gain.value=P.vd;l.connect(lg);lg.connect(o.detune);l.start(t);l.stop(t+d+P.r+.1)}
  o.start(t);o.stop(t+d+P.r+.1);
 });
}
function playLoop(tr,id){
 const c=ctx(),beat=60/tr.bpm,t0=Math.max(c.currentTime+.15,MUS.next||0);
 tr.m.forEach(e=>{if(e.n!=null)voice(c,MUS.tg,tr.inst,hz(e.n),t0+e.t*beat,e.d*beat*.98,tr.mv)});
 tr.c.forEach(e=>voice(c,MUS.tg,'organ',hz(e.n),t0+e.t*beat,e.d*beat,tr.cv));
 MUS.next=t0+16*beat;
 MUS.timer=setTimeout(()=>{if(MUS.cur===id)playLoop(tr,id)},Math.max(300,(MUS.next-c.currentTime-1)*1000));
}
function fadeAudio(a,to,done){const from=a.volume;let i=0;const iv=setInterval(()=>{i++;a.volume=Math.max(0,Math.min(1,from+(to-from)*i/20));if(i>=20){clearInterval(iv);if(done)done()}},40)}
// Одновременно играет ровно один трек: предыдущий плавно затихает и отключается
function musicStop(){
 clearTimeout(MUS.timer);MUS.cur=null;
 if(MUS.tg){const nodes=MUS.nodes,tg=MUS.tg;try{tg.gain.setTargetAtTime(0,AC.currentTime,.25)}catch(e){}setTimeout(()=>nodes.forEach(n=>{try{n.disconnect()}catch(e){}}),3000);MUS.tg=null;MUS.nodes=[]}
 if(MUS.audio){const a=MUS.audio;MUS.audio=null;fadeAudio(a,0,()=>a.pause())}
}
function musicStart(id){
 musicStop();const f=MUSIC_FILES.find(x=>x.id===id),tr=TRACKS[id];
 if(!f&&!tr){id='organ';D.music.track=id}
 MUS.cur=id;
 if(f){const a=new Audio(f.src);a.loop=true;a.volume=0;a.play().catch(()=>{});MUS.audio=a;fadeAudio(a,D.music.vol);return}
 const c=ctx(),tg=c.createGain(),dl=c.createDelay(1),fb=c.createGain(),wet=c.createGain();
 tg.gain.value=0;dl.delayTime.value=.38;fb.gain.value=.35;wet.gain.value=.3;
 tg.connect(mg());tg.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(mg());
 tg.gain.setTargetAtTime(1,c.currentTime,.5);MUS.tg=tg;MUS.nodes=[tg,dl,fb,wet];MUS.next=0;playLoop(TRACKS[id],id);
}
const trackList=()=>Object.entries(TRACKS).map(([id,t])=>[id,t.name]).concat(MUSIC_FILES.map(f=>[f.id,'🎧 '+f.name]));
function musicUI(){$('#musbtn').style.opacity=D.music.on?1:.55}
function musicToggle(){
 D.music.on=!D.music.on;save();musicUI();
 if(D.music.on){musicStart(D.music.track);const n=(trackList().find(t=>t[0]===D.music.track)||[0,''])[1];toast('Играет: '+n)}else musicStop();
}
function musicSetVol(v){
 D.music.vol=v;save();
 if(MG)MG.gain.setTargetAtTime(v*.5,AC.currentTime,.15);
 if(MUS.audio)fadeAudio(MUS.audio,v);
}
function musicSettings(){
 const mt=$('#mt'),mu=$('#mu'),mv=$('#mv');
 const draw=()=>{mt.innerHTML='';trackList().forEach(([id,name])=>{const b=el('button','tb'+(D.music.track===id?' on':''),name);b.onclick=()=>{D.music.track=id;save();if(!D.music.on)D.music.on=true;save();musicStart(id);musicUI();mu.textContent='🎵 Музыка: вкл';draw()};mt.appendChild(b)})};
 draw();
 mu.onclick=()=>{musicToggle();mu.textContent=D.music.on?'🎵 Музыка: вкл':'🎵 Музыка: выкл'};
 mv.oninput=()=>musicSetVol(mv.value/100);
}
$('#musbtn').onclick=musicToggle;
musicUI();
// Браузер разрешает звук только после действия пользователя: музыка стартует при первом касании
if(D.music.on)document.addEventListener('pointerdown',()=>{if(D.music.on&&!MUS.cur)musicStart(D.music.track)},{once:true});
document.addEventListener('visibilitychange',()=>{
 if(AC){document.hidden?AC.suspend():AC.resume()}
 if(MUS.audio){document.hidden?MUS.audio.pause():MUS.audio.play().catch(()=>{})}
});

/* ============ СТАРТ ============ */
buildGal();tickPet();setTimeout(checkGifts,800);
requestAnimationFrame(tick);
</script>
</body>
</html>
