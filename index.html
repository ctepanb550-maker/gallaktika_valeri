#rings{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

 wishes:[
  'Желаю тебе тишины внутри, даже когда вокруг шумно. Пусть тревоги приходят и уходят, как облака, не оставаясь на ночлег. Ты не обязан решать всё прямо сейчас. Сделай вдох, и пусть этого сегодня будет достаточно.',
  'Пусть у тебя будет своё тихое место: уголок, мелодия или привычка, которая возвращает тебя к себе. Желаю спокойных вечеров с тёплым пледом и без чувства вины за отдых. Всё важное подождёт до завтра. А что не подождёт, справится и без твоих нервов.',
  'Желаю тебе уверенности, что всё в итоге устроится. Не сразу и не идеально, но так, как нужно. Пусть сердце бьётся ровно, а мысли ложатся спать вовремя. Пусть доверие к жизни растёт с каждым днём.',
  'Пусть день будет мягким, как свет настольной лампы. Желаю неспешных утр, глубокого сна и разговоров, после которых становится легко. Не торопись: всё хорошее идёт своим шагом. Ты уже достаточно сделал, и это видно.',
  'Спокойствие — это не отсутствие дел, а умение не дрожать из-за каждого из них. Желаю тебе этого умения и друзей, рядом с которыми оно приходит само. Пусть внутри будет тихое море, а не шторм. И пусть сегодня на душе будет ровно и тепло.'
 ],
 secretWish:'Тайное: иногда лучшее, что можно сделать, — посидеть, как гусь на воде, и никуда не плыть. Я тебе это разрешаю. Хотя бы пять минут в день. Я даже посторожу, ГА.'
};

  let sx,sy,moved=0,on=false;
  el.onpointerdown=e=>{on=true;try{el.setPointerCapture(e.pointerId)}catch(_){}sx=e.clientX;sy=e.clientY};
  el.onpointermove=e=>{if(!on)return;const dx=e.clientX-sx,dy=e.clientY-sy;moved=Math.max(moved,Math.hypot(dx,dy));el.style.transform=`translate(-50%,-50%) translate(${dx}px,${dy}px)`};
  el.onpointerup=()=>{
   if(!on)return;on=false;
   const r=el.getBoundingClientRect(),t=target.getBoundingClientRect();
   const near=Math.hypot(r.left+r.width/2-(t.left+t.width/2),r.top+r.height/2-(t.top+t.height/2))<140;
   if(moved<10||near){el.onpointerdown=el.onpointermove=el.onpointerup=null;res()}
   else{el.animate([{transform:el.style.transform},{transform:'translate(-50%,-50%)'}],{duration:300});el.style.transform=''}
  };
 });
}

let AC=null;
function snd(k){
 if(!D.snd)return;
 try{
  AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
  const t=AC.currentTime,tone=(f,d,ty,v,f2,dl)=>{const o=AC.createOscillator(),g=AC.createGain(),t0=t+(dl||0);o.type=ty;o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d)};
  if(k==='tap')tone(520,.15,'sine',.1,880);
  else if(k==='key'){tone(784,.3,'triangle',.1);tone(1175,.4,'triangle',.08,0,.12)}
  else if(k==='chomp'){for(let i=0;i<4;i++)tone(220,.12,'square',.06,110,i*.35)}
  else if(k==='honk'){tone(420,.35,'sawtooth',.07,220)}
  else if(k==='boom'){const n=AC.sampleRate*.6,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const sr=AC.createBufferSource(),g=AC.createGain();sr.buffer=b;g.gain.value=.25;sr.connect(g);g.connect(AC.destination);sr.start(t);tone(140,.4,'sine',.2,40)}
 }catch(e){}
}

const LOCK=['Туда пока рано заглядывать. ГА!','Эта страница ещё склеена. Загляни попозже.','Тссс. Тут ещё не высохли чернила.'];
function renderDiary(){
 const S=agg(),sum=$('#dsum'),tabs=$('#dtabs'),body=$('#dbody');
 sum.innerHTML='';tabs.innerHTML='';body.innerHTML='';
 [['🌠',S.opened+' из 15','слов открыто'],['📜',S.done,'историй завершено'],['🥠',S.found,'пожеланий найдено'],['🏅',earned(S).length+' из '+ACH.length,'наград получено']].forEach(([i,n,t])=>{
  const d=el('div');d.append(el('span','',i+' '+n),el('small','',t));sum.appendChild(d)});
 const k=Math.min(10,Math.round(S.found/75*10)),bar=el('div','stars');
 bar.append(el('span','','★'.repeat(k)),el('i','','★'.repeat(10-k)));sum.appendChild(bar);
 TABS.forEach((t,i)=>{const b=el('button',i===tab?'on':'',t);b.onclick=()=>{tab=i;renderDiary();body.scrollTop=0};tabs.appendChild(b)});
 if(tab===0)WORDS.forEach(w=>{
  const s=D.words[w.id],m=w.wishes?w.wishes.length:5,r=el('div','row'),full=w.wishes&&s.found.length>=m;
  r.style.borderLeftColor=w.col;
  r.append(el('b','',(full?'🏆 ':s.done?'✦ ':s.opens?'🌱 ':'🌑 ')+w.name+(s.secret?'  🗝️':'')));
  r.append(el('small','',s.opens?`визитов: ${s.opens} · пожеланий: ${s.found.length} из ${m} · ${full?'всё собрано':s.done?'история пройдена':'в пути'}`:'ещё не открыта'));
  body.appendChild(r);
 });
 if(tab===1){
  let c=0;
  WORDS.forEach(w=>{
   const s=D.words[w.id];if(!w.wishes)return;
   const it=s.found.slice().sort((a,b)=>a-b).filter(i=>w.wishes[i]).map(i=>['Пожелание №'+(i+1),w.wishes[i]]);
   if(s.secret)it.push(['🗝️ Тайное',w.secretWish]);
   if(!it.length)return;c+=it.length;
   const h=el('h4','',w.name);h.style.borderBottomColor=w.col;body.appendChild(h);
   it.forEach(([t,x])=>{
    const b=el('button','wi');b.append(el('b','',t),el('span','',' — '+x.slice(0,34)+'…'));
    const p=el('p','wt',x);p.hidden=true;b.onclick=()=>{p.hidden=!p.hidden};body.append(b,p);
   });
  });
  if(!c)body.appendChild(el('p','empty','Здесь пока пусто. Скорми Валере печеньку — и пожелание появится в коллекции.'));
 }
 if(tab===2){const e=earned(S);ACH.forEach(a=>{const d=el('div','ach'+(e.includes(a[0])?'':' lk'));d.append(el('b','',(e.includes(a[0])?a[1]:'🔒')+' '+a[2]),el('small','',a[3]));body.appendChild(d)})}
 if(tab===3)notes(S).forEach(t=>body.appendChild(el('div','note',t)));
 if(tab===4)PAGES.forEach(([f,t],i)=>body.appendChild(f(S)?el('div','pg',t):el('div','pg lk',LOCK[i])));
}
function openDiary(){if(busy)return;renderDiary();const d=$('#diary');d.classList.remove('cl');d.classList.add('on')}
function closeDiary(){const d=$('#diary');d.classList.add('cl');setTimeout(()=>d.classList.remove('on','cl'),300)}
$('#bookbtn').onclick=openDiary;$('#dx').onclick=closeDiary;

/* ============ СТАРТ ============ */
buildGal();
requestAnimationFrame(tick);
</script>
</body>
</html>
